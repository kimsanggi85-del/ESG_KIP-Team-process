name: 품질 KPI 실적 자동 등록
on:
  schedule:
    - cron: '17 22 * * *'   # 매일 07:17 (한국시간)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 저장하지 않고 계산 결과만 확인'
        default: '0'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sf_quality_sync.mjs
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
