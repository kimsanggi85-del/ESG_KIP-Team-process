name: KPI 실적 자동 등록 (품질·생산)
on:
  schedule:
    - cron: '17 22 * * *'   # 매일 07:17 (한국시간)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 저장하지 않고 계산 결과만 확인'
        default: '0'
      months_back:
        description: '지난달부터 몇 개월 (기본 2)'
        default: '2'
      depts:
        description: '대상 부서 (Q=품질, P=생산)'
        default: 'Q,P'
      force:
        description: '직접 입력값이어도 덮어쓸 칸 (KPI번호@년-월, 쉼표로 여러 개. 예 259@2026-09)'
        default: ''
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/sf_kpi_sync.mjs
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          MONTHS_BACK: ${{ github.event.inputs.months_back || '2' }}
          DEPTS: ${{ github.event.inputs.depts || 'Q,P' }}
          FORCE: ${{ github.event.inputs.force || '' }}
